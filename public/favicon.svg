<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep obsidian with subtle graphite reflection -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="50%" stop-color="rgba(244,63,94,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>

    <!-- Brand Crimson Gradient for Seven Motors -->
    <linearGradient id="brand-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4554"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Metallic Pure White Accent -->
    <linearGradient id="accent-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Ambient Glow / Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#e11d48" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle rounded background (rounded-2xl) with subtle metallic stroke -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Inner subtle inset border for luxury glass look -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" ry="28.5" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Centered "7M" Monogram Emblem -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Stylized "7" -->
    <path d="M-36 -28 L14 -28 L-4 28 L-20 28 L-5 -12 L-36 -12 Z" fill="url(#brand-red)"/>
    <!-- Stylized "M" -->
    <path d="M-2 -8 L10 -8 L19 12 L28 -8 L40 -8 L40 28 L28 28 L28 10 L21 24 L17 24 L10 10 L10 28 L-2 28 Z" fill="url(#accent-white)"/>
    <!-- Supercar Speed Accent Wing Dot -->
    <circle cx="28" cy="-20" r="4.5" fill="url(#brand-red)"/>
  </g>
</svg>